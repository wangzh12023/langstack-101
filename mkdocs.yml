site_name: 语言栈 101
site_description: 一段程序如何变成可讨论的机器行为
site_author: Zihan
site_url: https://localhost/langstack-101/
repo_name: langstack-101
copyright: Available freely for personal study.

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  icon:
    logo: material/layers-triple
    repo: octicons/mark-github-16
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - css/extra.css
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css

extra_javascript:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra:
  social: []

# 导航按「读者在整条路径上走到哪一步」组织，不按术语表展开。
nav:
  - 首页: index.md
  - 怎么读: guide.md

  - 一、机器在算什么:
    - 这一章的位置: ch01/index.md
    - 整数与浮点: ch01/numbers.md
    - 执行、存储与指令契约: ch01/machine.md

  - 二、从汇编到正在运行的进程:
    - 这一章的位置: ch02/index.md
    - 指令级程序: ch02/instructions.md
    - 函数怎样互相调用: ch02/calling.md
    - 怎样变成进程里的映像: ch02/link-load.md
    - 跟内核交接时还会碰到的事: ch02/kernel-boundary.md
    - 实验：手写 fibonacci: ch02/fib-asm-lab.md

  - 三、编译器怎样改写这条路径:
    - 这一章的位置: ch03/index.md
    - 中间表示与优化: ch03/ir-and-opt.md
    - 生成机器码与对着调试: ch03/backend-and-debug.md
    - 实验：C 到 IR 到目标码: ch03/c-to-asm-lab.md

  - 四、比较语言时看哪些面:
    - 这一章的位置: ch04/index.md
    - 类型、内存、执行方式: ch04/axes-core.md
    - 并发、对象、正确性边界与 FFI: ch04/axes-boundary.md

  - 五、具体语言怎样落下来:
    - 这一章的位置: ch05/index.md
    - C、C++、Rust、Go: ch05/systems.md
    - JVM、.NET、Swift: ch05/managed.md
    - Python、JavaScript 与其他动态运行时: ch05/dynamic.md
    - 用同一张表读跨语言数字: ch05/cross-language-matrix.md

  - 六、串起来:
    - 从源码到硅片: ch06/source-to-silicon.md
    - 性能数字怎么读: ch06/reading-benchmarks.md
    - 对话时能指回的事实: ch06/advisor-checklists.md

  - 附录:
    - 术语表: appendix/glossary.md
    - 工具链速查: appendix/toolchain.md
    - 推荐读物: appendix/reading.md
    - 编写规范: appendix/writing-spec.md
    - 口试量规: Spec/oral-rubric.md
    - 旧版细目存档说明: Spec/legacy-pages.md
